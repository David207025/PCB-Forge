[workspace]
members = ["cargo:."]
resolver = "2"

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew", "msi"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc"
]
install-path = "CARGO_HOME"
install-updater = false
env = { PKG_CONFIG_ALLOW_CROSS = "1" }

# Correct container configuration syntax for cargo-dist custom runners
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = { runner = "ubuntu-22.04", container = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge" }
x86_64-unknown-linux-gnu = { runner = "ubuntu-22.04", container = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:edge" }

[dist.dependencies.apt]
libgtk-3-dev = "*"
"libwebkit2gtk-4.1-dev" = "*"
pkg-config = "*"
xz-utils = "*"