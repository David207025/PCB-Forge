[package]
name = "pcbfapi"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/David207025/PCB-Forge.git"
authors = ["David207025"]
description = "PCBF API is the background task used by the PCB-Forge VS-Code extension. This API manages the PDF creation and BOM storage/generation"
homepage = "https://github.com/David207025/PCB-Forge.git"

[package.metadata.wix]
upgrade-guid = "61493CE6-9B9A-4E7E-BFBD-FCAE378ED36F"
path-guid = "654E5F75-1439-49AC-B81F-BFA57EC704F1"
license = false
eula = false

[[bin]]
name = "pcbfapi"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.19"
tao = "0.30"
image = "0.25"
schemars = "1.2.2"
typst = "0.15.1"
typst-pdf = "0.15.1"
fontdb = "0.23.0"
chrono = "0.4.45"
include_dir = "0.7.4"
pulldown-cmark = "0.13.4"
pulldown-cmark-to-cmark = "22.0.1"
lopdf = "0.44.0"
qdrant-client = "1.19.0"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"
hf-hub = "0.4"
csv = "1.4.0"
anyhow = "1.0.104"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"