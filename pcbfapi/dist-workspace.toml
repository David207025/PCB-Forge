[workspace.metadata.dist]
# The cargo-dist version to use in CI
cargo-dist-version = "0.32.0"
# CI provider
ci = ["github"]
# Target triple matrix (Intel macOS re-enabled)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
# Installers to generate
installers = ["shell", "powershell", "homebrew", "msi"]
# Homebrew tap target
tap = "David207025/homebrew-pcb-forge"
# GitHub release publisher
publishers = ["github"]

# Global environment variables injected into all cargo-dist runner jobs
[workspace.metadata.dist.env]
ORT_STRATEGY = "download"